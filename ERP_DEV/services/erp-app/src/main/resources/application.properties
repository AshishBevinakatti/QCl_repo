# erp-app runtime config. Secrets via environment only (never committed).
# Local default points at docker-compose Postgres; override with DB_URL/DB_USER/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resort_erp}
spring.datasource.username=${DB_USER:resort_user}
spring.datasource.password=${DB_PASSWORD:change-me-locally-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Auth (Keycloak issuer; blank = closed endpoints reject with 401 until realm is set).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:}
# OpenAPI (contract lives at /v3/api-docs; UI at /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs

# Observability / ops console (Phase 1). Telemetry endpoints are optional:
# blank = NOT_CONFIGURED (honest state), app still starts without a collector.
spring.application.name=erp-app
ops.environment=${OPS_ENVIRONMENT:local}
ops.prometheus-url=${OPS_PROMETHEUS_URL:}
ops.loki-url=${OPS_LOKI_URL:}
ops.tempo-url=${OPS_TEMPO_URL:}
ops.grafana-url=${OPS_GRAFANA_URL:}
ops.integration-timeout-ms=${OPS_INTEGRATION_TIMEOUT_MS:2000}
ops.telemetry-stale-seconds=${OPS_TELEMETRY_STALE_SECONDS:120}

# Actuator stays on a loopback-only management port; Phase 1 exposes health/info only.
management.server.port=${MANAGEMENT_PORT:9091}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:dev}

# Tracing: OTLP/HTTP exporter; a missing collector must not stop the app.
management.tracing.enabled=${OTEL_TRACING_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACE_SAMPLE_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}

# JSON logs (console + rolling file for Loki/Promtail in Phase 2).
logging.file.name=${LOG_FILE:logs/erp-app.jsonl}
