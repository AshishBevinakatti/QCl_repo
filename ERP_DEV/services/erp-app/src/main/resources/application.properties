# erp-app runtime config. Secrets via environment only (never committed).
# Local default points at docker-compose Postgres; override with DB_URL/DB_USER/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resort_erp}
spring.datasource.username=${DB_USER:resort_user}
spring.datasource.password=${DB_PASSWORD:change-me-locally-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Auth (Keycloak issuer; blank = closed endpoints reject with 401 until realm is set).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:}
# OpenAPI (contract lives at /v3/api-docs; UI at /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
