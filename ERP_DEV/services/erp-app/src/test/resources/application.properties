# Test profile: H2 in PostgreSQL-compatibility mode (no Docker needed for unit slice).
# Runtime still targets real Postgres (see application.properties + compose).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Let the test JWT stub replace the Keycloak decoder bean.
spring.main.allow-bean-definition-overriding=true

# Ops Phase 1: no management server or OTLP exporter during tests.
management.server.port=-1
management.tracing.enabled=false
ops.prometheus-url=
ops.loki-url=
ops.tempo-url=
ops.grafana-url=
logging.file.name=

spring.profiles.active=test
