# Configuration names: docs/02-architecture/identity/KEYCLOAK-SETUP.md §9. Secrets come from the environment only.
server:
  port: ${PORT:8082}   # the unchanged landing page calls :8082 (ARCHITECTURE §2)

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestSize
              args:
                maxSize: ${MAX_REQUEST_SIZE:1MB}
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@callerKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PER_SECOND:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: access-service
              uri: ${ACCESS_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/me,/api/v1/admin/**

erp:
  keycloak:
    issuer: ${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:gh-staff}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
