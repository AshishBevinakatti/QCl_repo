server:
  port: ${PORT:8082}

spring:
  application:
    name: lead-service
  config:
    # Local secrets (git-ignored ERP_DEV/.env, KEY=VALUE lines); real env vars still win. Missing file is fine.
    import: optional:file:${ENV_FILE:../../.env}[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resort_erp?currentSchema=leads_mgmt}
    username: ${DB_USER:resort_user}
    password: ${DB_PASSWORD:change-me-locally-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: leads_mgmt
  flyway:
    enabled: true
    schemas: leads_mgmt
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://localhost:8081/realms/resort}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  erp-app:
    base-url: ${ERP_APP_URL:http://localhost:8080}
  sla:
    claim-timeout-minutes: 5
    scheduler-interval-ms: 10000 # check every 10 seconds
  notification:
    sales-executive-phone: "+91-9876543210"
    voice-escalation-enabled: true
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    provider: ${WHATSAPP_PROVIDER:mock} # mock | meta
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:new_lead_assigned}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en}
    dispatch-interval-ms: 5000
  staff-directory:
    base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:resort}
    client-id: ${LEAD_SERVICE_CLIENT_ID:lead-service}
    client-secret: ${LEAD_SERVICE_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
