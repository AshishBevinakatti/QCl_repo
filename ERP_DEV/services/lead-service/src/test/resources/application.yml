server:
  port: 0

spring:
  application:
    name: lead-service-test
  datasource:
    url: jdbc:h2:mem:leadtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-chars-long-for-hmac-sha256-test
    expiration-ms: 3600000
  erp-app:
    base-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  sla:
    claim-timeout-minutes: 5
    scheduler-interval-ms: 60000
  notification:
    sales-executive-phone: "+91-9876543210"
    voice-escalation-enabled: true
  whatsapp:
    enabled: true
    provider: mock
    graph-base-url: https://graph.facebook.com
    api-version: v21.0
    phone-number-id: "000000000000000"
    access-token: test-access-token
    app-secret: test-app-secret
    verify-token: test-verify-token
    template-name: new_lead_assigned
    template-language: en
    dispatch-interval-ms: 3600000
    dispatch-initial-delay-ms: 3600000
  staff-directory:
    base-url: http://localhost:65535
    client-secret: ""
