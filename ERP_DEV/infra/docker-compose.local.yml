# Local dev stack (Phase 2 slice: definitions only — needs Docker to run).
# Postgres (OLTP) + Redis (cache) + Kafka (events) + Keycloak (auth).
# Secrets here are LOCAL-DEV-ONLY fakes; staging/prod use Vault/K8s Secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: resort_erp
      POSTGRES_USER: resort_user
      POSTGRES_PASSWORD: change-me-locally-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: change-me-locally-only
    ports:
      - "8080:8080"

volumes:
  pgdata:
