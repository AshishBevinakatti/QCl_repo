name: ci

# Phase 1 layout (docs/02-architecture/ARCHITECTURE.md §7): each service and app builds on its own.
# A service or app job is a no-op until its pom.xml / package.json exists (Milestone 1 has docs only).

on:
  push:
    branches: ["main", "feature/**", "docs/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  landing-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Lint is not run: 4 errors already exist and the landing page is frozen in Phase 1 (OPEN_QUESTIONS Q-004).
      - run: npm run build

  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, access-service, guest-service, lead-service]
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f "ERP_DEV/services/${{ matrix.service }}/pom.xml" ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::${{ matrix.service }} has no pom.xml yet; skipped"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - if: steps.present.outputs.yes == 'true'
        name: Build + test ${{ matrix.service }}
        run: mvn -B verify -f ERP_DEV/services/${{ matrix.service }}/pom.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f ERP_DEV/web/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::ERP_DEV/web has no package.json yet; skipped"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ERP_DEV/web/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        name: Install, lint, test, build
        working-directory: ERP_DEV/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
